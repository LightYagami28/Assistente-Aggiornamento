name: Validate and Test ISO Catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Catalog (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Harden Runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate catalog structure, policy, and cryptographic anchors (pwsh)
        shell: pwsh
        run: ./scripts/Validate-Links.ps1

      - name: Run security test suite (pwsh)
        shell: pwsh
        run: ./scripts/Validate-Links.Tests.ps1

  validate-windows-ps5:
    name: Validate Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate catalog under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\Validate-Links.ps1

      - name: Run security test suite under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\Validate-Links.Tests.ps1
